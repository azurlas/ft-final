apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config}
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files: [/etc/prometheus/rules.yml]
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [midterm, midterm-baseline, midterm-gateway]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            regex: '(.+)'
            target_label: __metrics_path__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: '$1:$2'
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_component]
            target_label: component
          - source_labels: [__meta_kubernetes_pod_label_profile]
            target_label: profile
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: 'rr_.*|go_.*|process_.*|university_.*|envoy_.*'
  # Incident indicators. No Alertmanager: firing alerts are visible in Prometheus
  # /alerts, its /api/v1/alerts API and the Grafana "Firing alerts" panel (ALERTS series).
  # The university_* series come from the worker pods' metrics endpoint.
  rules.yml: |
    groups:
      - name: university
        rules:
          - alert: DatabaseDown
            expr: min by (profile) (university_database_up) == 0
            for: 10s
            labels: {severity: critical}
            annotations:
              summary: 'MySQL unreachable from the {{`{{ $labels.profile }}`}} workers'
          - alert: ApiReplicasDegraded
            expr: (count(up{component="api",profile="resilient"} == 1) or vector(0)) < 2
            for: 15s
            labels: {severity: warning}
            annotations:
              summary: 'Fewer than 2 healthy API instances in the resilient profile (redundancy lost)'
          - alert: PaymentBacklogStuck
            expr: max by (profile) (university_purchase_oldest_pending_seconds) > 60
            for: 10s
            labels: {severity: critical}
            annotations:
              summary: 'An accepted purchase has been pending for over 60 s in {{`{{ $labels.profile }}`}}'
          - alert: PaymentCircuitOpen
            expr: max by (profile) (university_circuit_open) == 1
            labels: {severity: warning}
            annotations:
              summary: 'Payment provider circuit breaker is open in {{`{{ $labels.profile }}`}}'
          - alert: AuthFailureSpike
            expr: sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq{envoy_response_code=~"401|403|429"}[1m])) > 1
            for: 10s
            labels: {severity: warning}
            annotations:
              summary: 'More than 1 denied request/s (401/403/429) on {{`{{ $labels.envoy_cluster_name }}`}}: possible brute force or misuse'
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-provisioning}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        uid: victorialogs
        access: proxy
        url: http://vlogs-victoria-logs-single-server:9428
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: University
        folder: University
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-dashboards}
data:
  roadrunner.json: |
{{ .Files.Get "dashboards/roadrunner.json" | indent 4 }}
  university.json: |
{{ .Files.Get "dashboards/university.json" | indent 4 }}
