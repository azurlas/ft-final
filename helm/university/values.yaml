image: midterm/university:dev
profile: resilient
hostname: midterm.sailaubek.dev
apiReplicas: 2
workerReplicas: 2
gatewayReplicas: 2
gatewayPort: 80
# Attach the HTTPRoute to a shared Gateway parentRef instead of creating this release's EnvoyProxy/Gateway.
externalGateway: {}
secretName: university-secrets
storageClass: local-path
backupEnabled: true
resources:
  requests: {cpu: 100m, memory: 160Mi}
  limits: {cpu: "2", memory: 512Mi}
